services:
  - type: web
    name: robot-browser-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOSTED
        value: "1"
      - key: BROWSER_MODE
        value: requests
      - key: PUBLIC_DEMO
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
